<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="auth-page" class="page" hidden>
    <section class="card auth-card">
      <h1 class="title">Project Manager</h1>
      <p class="subtitle">Plan together, wherever you are.</p>
      <div class="tabs" role="tablist" aria-label="Sign in or sign up">
        <button type="button" class="tab is-active" id="tab-signin" role="tab" aria-selected="true">Sign in</button>
        <button type="button" class="tab" id="tab-signup" role="tab" aria-selected="false">Create account</button>
      </div>
      <form id="auth-form" class="form">
        <label class="field"><span>Email</span><input type="email" id="email" placeholder="you@example.com" autocomplete="email" required></label>
        <label class="field"><span>Password</span><input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" minlength="6" required></label>
        <button type="submit" class="btn" id="submit-btn">Sign in</button>
      </form>
      <div class="google-login">
        <div class="auth-divider"><span>or continue with</span></div>
        <button type="button" id="google-login-btn" class="google-btn">
          <svg viewBox="0 0 48 48" width="17" height="17" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.27 5.48-4.79 7.18l7.73 6C44.4 38.03 46.98 31.88 46.98 24.55z"/><path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.12.77-4.59l-7.98-6.2A23.87 23.87 0 0 0 0 24c0 3.87.93 7.52 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.17 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Continue with Google
        </button>
      </div>
      <p id="message" class="message" role="status" hidden></p>
    </section>
  </main>

  <div id="app-view" class="shell" hidden>
    <aside class="side">
      <div class="top">
        <span class="logo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20v-7"/><path d="M12 13c-4 0-6.5-2.4-6.5-6 4.2 0 6.5 2.4 6.5 6Z"/><path d="M12 11.5c0-3.4 2.2-5.8 6.5-5.8 0 3.6-2.5 5.8-6.5 5.8Z"/></svg></span>
        <span class="lbl brand">Project Manager</span>
        <div class="topbar">
          <button type="button" class="tb-btn" id="side-toggle" aria-label="Collapse sidebar" title="Collapse or expand sidebar"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3.5"/><path d="M9.5 4.5v15"/></svg></button>
        </div>
        
      </div>
      <div class="group-wrap">
        <button type="button" id="group-switch-btn" class="group-switch" title="Switch group" aria-label="Switch group or manage workspace" aria-haspopup="menu" aria-expanded="false">
        <span class="gs-badge" id="group-badge">P</span>
        <span class="gs-text lbl"><strong id="group-name"></strong><span id="group-code"></span></span>
        <svg class="ic gs-chev lbl" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 9.5 4-4 4 4M8 14.5l4 4 4-4"/></svg>
      </button>
        <div id="group-menu" class="group-menu" role="menu" hidden></div>
      </div>
      <nav id="nav">
        <button type="button" data-go="home" title="Home"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7"/><path d="M6 9.5V20h12V9.5"/></svg><span class="lbl">Home</span></button>
        <button type="button" data-go="tasks" title="Tasks"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="16" rx="2"/><rect x="13.5" y="4" width="6.5" height="9" rx="2"/></svg><span class="lbl">Tasks</span></button>
        <button type="button" data-go="schedule" title="Schedule"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span class="lbl">Schedule</span></button>
        <button type="button" data-go="invites" title="Invites"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="3"/><path d="m4.5 8 7.5 5.5L19.5 8"/></svg><span class="lbl">Invites</span></button>
        <button type="button" data-go="directory" title="Directory"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.6-3.6 3.5-5.5 7-5.5s6.4 1.9 7 5.5"/></svg><span class="lbl">Directory</span></button>
        <button type="button" data-go="settings" title="Settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2m0 15v2m9.5-9.5h-2m-15 0h-2m16.2-6.7-1.4 1.4m-11.2 11.2-1.4 1.4m14 0-1.4-1.4M6.3 6.3 4.9 4.9"/></svg><span class="lbl">Settings</span></button>
      </nav>
      <div class="account">
        <span class="account-badge" id="who-badge" aria-hidden="true">?</span>
        <p id="who" class="who lbl"></p>
        <button type="button" class="icon" id="signout-btn" title="Sign out" aria-label="Sign out"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4.5H7A2.5 2.5 0 0 0 4.5 7v10A2.5 2.5 0 0 0 7 19.5h3"/><path d="m15 8.5 3.5 3.5-3.5 3.5M18.5 12H9.5"/></svg></button>
      </div>
    </aside>
    <main id="content" class="content"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js"></script>
</body>
</html>
